name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cpu:
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest
      - run: pip wheel . --no-deps --wheel-dir dist
  triton-interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e '.[dev,triton]'
      - run: TRITON_INTERPRET=1 pytest -m triton_interpreter
  vllm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: v0.25.0
          path: .vendor/vllm
          sparse-checkout: vllm/v1/kv_offload
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_vllm_contract.py .vendor/vllm
  gds-compile:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - name: Install build prerequisites and cuFile headers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 python3-dev python3-pip libcufile-dev-12-8
      - uses: actions/checkout@v4
      - name: Install CUDA-enabled PyTorch
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install ninja numpy
          python3 -m pip install --index-url https://download.pytorch.org/whl/cu128 torch
      - name: Build and import the optional cuFile extension
        env:
          KVSSD_BUILD_GDS: "1"
        run: |
          python3 -m pip install . --no-build-isolation --no-deps -v
          python3 -c "from kvssd import _gds; assert hasattr(_gds, 'GDSFile')"
